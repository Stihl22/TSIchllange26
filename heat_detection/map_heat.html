<!DOCTYPE html>
<html>
<head>
    <title>VitiBrain Pro | Restricted Zone Management</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2YzDb8YdUG0a90eYJogkIdyzcCKtk2tE&callback=initMap&libraries=drawing" async defer></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: #050505; }
        #map { height: 100vh; width: 100%; filter: brightness(0.8) contrast(1.2); }
        
        .dashboard { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(10, 20, 10, 0.9); border-left: 4px solid #2ecc71;
            padding: 25px; border-radius: 20px; z-index: 1000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); width: 320px;
            backdrop-filter: blur(15px); color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .sensor-info { font-size: 0.7em; color: #2ecc71; text-transform: uppercase; font-weight: 900; letter-spacing: 2px; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
        .data-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .val { font-size: 1.5em; font-weight: 800; color: #fff; }
        .label { font-size: 0.6em; color: #aaa; display: block; margin-bottom: 5px; text-transform: uppercase; }

        .alert-zone { padding: 15px; border-radius: 10px; text-align: center; font-weight: 900; font-size: 0.85em; text-transform: uppercase; transition: 0.4s; }
        .st-ideal { background: #2ecc71; color: #fff; }
        .st-heat { background: #333; color: #ff4757; border: 1px solid #ff4757; }
        .st-dry { background: #f8d7da; color: #721c24; border: 2px solid #e74c3c; }
        .st-pest { background: #fff3cd; color: #856404; }
        .st-scanning { background: #27ae60; color: #fff; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        .map-hud { position: absolute; top: 20px; right: 20px; color: #2ecc71; font-family: monospace; font-size: 0.7em; z-index: 1000; text-align: right; pointer-events: none; }
        .lock-status { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: #e74c3c; padding: 4px 10px; border-radius: 20px; margin-bottom: 5px; display: inline-block; }
    </style>
</head>
<body>
    <div class="map-hud">
        <div class="lock-status">BOUNDS_LOCKED</div><br>
        SYSTEM: VITI-SCAN v4.2<br>
        LOC: QUINTA_DA_ROEDA<br>
        <span id="coords">LAT: -- | LNG: --</span>
    </div>

    <div class="dashboard" id="dash">
        <div class="sensor-info" id="sid">VITI_SENSOR_INIT</div>
        <h2 style="margin: 5px 0; font-size: 1.6em; letter-spacing: -1px;">VitiBrain <span style="font-weight: 300; color: #2ecc71;">AI</span></h2>
        
        <div class="data-grid">
            <div class="data-card"><span class="label">TEMP. FOLIAR</span><span class="val" id="t">--</span><small>°</small></div>
            <div class="data-card"><span class="label">HUMIDADE SOLO</span><span class="val" id="h">--</span><small>%</small></div>
        </div>

        <div id="status" class="alert-zone st-ideal">A ANALISAR TERRENO...</div>
    </div>

    <div id="map"></div>

    <script>
        let map, currentOverlay, redeSensores = [];
        const baseLat = 41.1930, baseLng = -7.5350;

        // Limites estritos da Quinta da Roêda (Área Restrita)
        const ROEDA_BOUNDS = {
            north: 41.1980,
            south: 41.1880,
            west: -7.5450,
            east: -7.5250
        };

        for (let i = 0; i < 40; i++) {
            redeSensores.push({
                id: "P_SENSOR_" + (i + 1).toString().padStart(2, '0'),
                lat: baseLat + (Math.random() - 0.5) * 0.005,
                lng: baseLng + (Math.random() - 0.5) * 0.005,
                t: parseFloat((18 + Math.random() * 26).toFixed(1)),
                h: parseFloat((25 + Math.random() * 70).toFixed(1))
            });
        }

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 17, 
                center: { lat: baseLat, lng: baseLng },
                mapTypeId: 'satellite', 
                tilt: 45, 
                disableDefaultUI: true,
                // --- CONFIGURAÇÃO DE ÁREA RESTRITA ---
                restriction: {
                    latLngBounds: ROEDA_BOUNDS,
                    strictBounds: true // Impede o utilizador de arrastar para fora
                },
                minZoom: 16, // Impede zoom out excessivo que mostre fora da quinta
                maxZoom: 20
            });

            const status = document.getElementById("status");

            map.addListener("mousemove", (e) => {
                document.getElementById("coords").innerText = `LAT: ${e.latLng.lat().toFixed(4)} | LNG: ${e.latLng.lng().toFixed(4)}`;
                
                if (status.innerText.includes("COLHEITA") || status.innerText.includes("SCANNING")) return;

                let nearest = redeSensores[0];
                let minDist = Infinity;
                redeSensores.forEach(s => {
                    let d = Math.sqrt(Math.pow(e.latLng.lat()-s.lat,2)+Math.pow(e.latLng.lng()-s.lng,2));
                    if(d < minDist) { minDist = d; nearest = s; }
                });

                document.getElementById("t").innerText = nearest.t;
                document.getElementById("h").innerText = nearest.h;
                document.getElementById("sid").innerText = nearest.id;

                if (nearest.t > 38) {
                    status.innerText = "CALOR EXTREMO";
                    status.className = "alert-zone st-heat";
                } else if (nearest.h < 35) {
                    status.innerText = "REGA NECESSÁRIA";
                    status.className = "alert-zone st-dry";
                } else if (nearest.h > 82) {
                    status.innerText = "RISCO DE PRAGA";
                    status.className = "alert-zone st-pest";
                } else {
                    status.innerText = "ESTADO: IDEAL";
                    status.className = "alert-zone st-ideal";
                }
            });

            const drawingManager = new google.maps.drawing.DrawingManager({
                drawingMode: null, drawingControl: true,
                drawingControlOptions: { position: google.maps.ControlPosition.TOP_CENTER, drawingModes: ['rectangle'] },
                rectangleOptions: { fillOpacity: 0.1, fillColor: '#2ecc71', strokeWeight: 2, strokeColor: '#2ecc71' }
            });
            drawingManager.setMap(map);

            google.maps.event.addListener(drawingManager, 'rectanglecomplete', function(rectangle) {
                const bounds = rectangle.getBounds();
                status.innerText = "SCANNING IA...";
                status.className = "alert-zone st-scanning";
                map.fitBounds(bounds);

                setTimeout(() => {
                    if (currentOverlay) currentOverlay.setMap(null);
                    
                    // Lógica aleatória entre as 5 imagens
                    const randomNum = Math.floor(Math.random() * 5);
                    let imgName = randomNum === 0 ? "HeatDetection_Vineyard.png" : `HeatDetection_Vineyard${randomNum + 1}.png`;

                    currentOverlay = new google.maps.GroundOverlay(imgName, bounds, { opacity: 1.0 });
                    currentOverlay.setMap(map);

                    status.innerText = "COLHEITA: IMEDIATA";
                    status.className = "alert-zone st-dry";
                    rectangle.setMap(null);
                }, 1500);
            });
        }
    </script>
</body>
</html>
